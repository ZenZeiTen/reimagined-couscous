[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retroforge"
version = "0.1.0"
description = "A 2D game engine for 16-bit-era (SNES/Genesis) retro games"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RetroForge" }]
keywords = ["game-engine", "2d", "retro", "snes", "genesis", "pygame", "16-bit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: pygame",
]
dependencies = [
    "pygame-ce>=2.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/zenzeiten/reimagined-couscous"

[tool.setuptools.packages.find]
where = ["."]
include = ["retroforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
